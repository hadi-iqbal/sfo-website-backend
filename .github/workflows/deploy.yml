name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Require the knowledge files
        run: |
          test -s "knowledge/RADON AI.pdf"
          test -s "knowledge/sfo-public-website-knowledge-2026-11.pdf"
          test -s "knowledge/rapid_rater.db"
          find knowledge -type f -name '*.pdf' -print
      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader
      - name: Stage knowledge files for the live API paths
        run: |
          mkdir -p storage/app
          cp -f knowledge/*.pdf storage/app/
          find knowledge -type f -name '*.pdf' -print
      - name: Pack one release archive
        run: |
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./tests \
            --exclude=./node_modules \
            --exclude=./.env \
            --exclude=./.env.backup \
            --exclude=./.env.production \
            --exclude=./.env.local \
            --exclude=./storage/logs \
            --exclude=./storage/framework/cache \
            --exclude=./storage/framework/sessions \
            --exclude=./storage/framework/views \
            --exclude=./storage/app/private \
            --exclude=./storage/app/public \
            --exclude=./storage/app/resumes \
            --exclude=./storage/app/team \
            --exclude=./bootstrap/cache \
            --exclude='*.pem' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-journal' \
            .
          if tar -tzf "$RUNNER_TEMP/release.tar.gz" | grep -E '(^|/)[.]env$'; then
            exit 1
          fi
          test -s "$RUNNER_TEMP/release.tar.gz"
          cp "$RUNNER_TEMP/release.tar.gz" release.tar.gz

      - name: Prepare the cPanel key
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/cpanel
          chmod 600 ~/.ssh/cpanel

      - name: Upload the release
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p 22 "$SSH_USER@$SSH_HOST" "mkdir -p /home/kerana2014/sfo-api"
          scp -i ~/.ssh/cpanel -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -P 22 release.tar.gz "$SSH_USER@$SSH_HOST:/home/kerana2014/sfo-api/release.tar.gz"

      - name: Apply new tables without touching existing rows
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p 22 "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
          set -eu
          export TERM="${TERM:-xterm}"
          cd /home/kerana2014/sfo-api
          test -s .env
          test -s release.tar.gz
          tar -xzf release.tar.gz
          rm -f release.tar.gz
          mkdir -p storage/app bootstrap/cache
          cp -f knowledge/*.pdf storage/app/
          rm -f bootstrap/cache/*.php
          php artisan package:discover --ansi
          php artisan config:clear
          connection=$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.default");')
          test "$connection" = "mysql"
          php artisan route:clear
          php artisan view:clear
          php artisan migrate --force --no-interaction --isolated
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart
          EOF
