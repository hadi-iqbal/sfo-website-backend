name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Require the knowledge files
        run: |
          test -s "knowledge/RADON AI.pdf"
          test -s "knowledge/sfo-public-website-knowledge-2026-11.pdf"
          test -s "knowledge/rapid_rater.db"
          find knowledge -type f -name '*.pdf' -print
      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader
      - name: Stage knowledge files for the live API paths
        run: |
          mkdir -p storage/app
          cp -f knowledge/*.pdf storage/app/
          find knowledge -type f -name '*.pdf' -print

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          timeout: 600000
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.backup
            **/.env.production
            **/.env.local
            **/node_modules/**
            **/tests/**
            **/*.pem
            **/*.log
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/private/**
            **/storage/app/public/**
            **/storage/app/resumes/**
            **/storage/app/team/**
            **/storage/app/*.pem
            **/bootstrap/cache/*.php

      - name: Check for a cPanel shell
        id: shell
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate on the server
        if: steps.shell.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          script: |
            cd /home/kerana2014/sfo-api
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
